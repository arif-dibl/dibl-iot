volumes:
  proxy-data:
  manager-data:
  postgresql-data:


services:
  postgresql:
    restart: always
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest}
    shm_size: 128mb
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - manager-data:/storage
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    restart: always
    image: openremote/keycloak:${KEYCLOAK_VERSION:-latest}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./deploy:/deployment
    # CRITICAL: Allow internal resolution of public hostname for token validation
    extra_hosts:
      - "${OR_HOSTNAME}:host-gateway"
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:?Admin password required}
      KC_HOSTNAME: ${OR_HOSTNAME:?Hostname required}
      KC_HOSTNAME_PORT: ${OR_SSL_PORT:--1}
      # CRITICAL: Trust X-Forwarded headers from Traefik/HAProxy
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      # CRITICAL: Fix the issuer URL in JWT tokens to match the external URL
      # This ensures tokens are issued with the correct 'iss' claim that the Manager expects
      KEYCLOAK_ISSUER_BASE_URI: https://${OR_HOSTNAME}/auth

  manager:
    restart: always
    image: openremote/manager:${MANAGER_VERSION:-latest}
    depends_on:
      keycloak:
        condition: service_healthy
    # CRITICAL: Allow internal resolution of public hostname for JWT validation
    # This fixes the hairpin NAT issue where Manager can't reach Keycloak's JWKS endpoint
    extra_hosts:
      - "${OR_HOSTNAME}:host-gateway"
    environment:
      OR_HOSTNAME: ${OR_HOSTNAME:?Hostname required}
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:?Admin password required}
      OR_SSL_PORT: ${OR_SSL_PORT:--1}
      OR_DEV_MODE: ${OR_DEV_MODE:-false}
      OR_METRICS_ENABLED: ${OR_METRICS_ENABLED:-true}
      # CRITICAL: Tell Manager to use internal Keycloak hostname for token validation
      OR_KEYCLOAK_HOST: keycloak
      OR_KEYCLOAK_PORT: 8080
      OR_SETUP_TYPE:
      OR_SETUP_RUN_ON_RESTART:
      OR_EMAIL_HOST:
      OR_EMAIL_USER:
      OR_EMAIL_PASSWORD:
      OR_EMAIL_X_HEADERS:
      OR_EMAIL_FROM:
      OR_EMAIL_ADMIN:
      OR_ADDITIONAL_HOSTNAMES:
      OR_FORECAST_SOLAR_API_KEY:
      OR_OPEN_WEATHER_API_APP_ID:
      OR_SETUP_IMPORT_DEMO_AGENT_KNX:
      OR_SETUP_IMPORT_DEMO_AGENT_VELBUS:
    volumes:
      - manager-data:/storage

  proxy:
    image: openremote/proxy:${PROXY_VERSION:-latest}
    restart: always
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "8883:8883"
      - "1883:1883"
    configs:
      - source: haproxy-config
        target: /data/proxy/haproxy.cfg
      - source: mqtt-server-cert
        target: /certs/mqtt-server-combined.pem
      - source: mqtt-ca-cert
        target: /certs/ca.pem
    volumes:
      - proxy-data:/deployment
    environment:
      HAPROXY_CONFIG: '/data/proxy/haproxy.cfg'
      DOMAINNAME: ${OR_HOSTNAME:?Hostname required}
      DOMAINNAMES: ${OR_ADDITIONAL_HOSTNAMES:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openremote.rule=Host(`${OR_HOSTNAME}`)"
      - "traefik.http.routers.openremote.entrypoints=http,https"
      - "traefik.http.routers.openremote.tls=true"
      - "traefik.http.services.openremote.loadbalancer.server.port=80"
      - "traefik.http.services.openremote.loadbalancer.server.scheme=http"
      - "traefik.http.services.openremote.loadbalancer.healthcheck.path=/docker-health"
      - "traefik.http.routers.openremote.priority=1"
      # WebSocket and header passthrough support
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.openremote.middlewares=sslheader"

  custom-ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
    # Allow internal hostname resolution
    extra_hosts:
      - "${OR_HOSTNAME}:host-gateway"
    environment:
      OR_HOSTNAME: ${OR_HOSTNAME:?Hostname required}
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:?Admin password required}
      # Subpath prefix for reverse proxy routing
      APP_PREFIX: /customui
