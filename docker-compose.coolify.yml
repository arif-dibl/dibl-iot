volumes:
  proxy-data:
  manager-data:
  postgresql-data:
  hawkbit-data:
  hawkbit-artifact-data:

services:
  postgresql:
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest}
    restart: always
    shm_size: 128mb
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - manager-data:/storage
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: openremote/keycloak:${KEYCLOAK_VERSION:-latest}
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./deploy:/deployment
    extra_hosts:
      - "${OR_HOSTNAME}:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/auth/health/ready || curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:?Admin password required}
      KC_HOSTNAME: ${OR_HOSTNAME:?Hostname required}
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: "INFO"
      KC_HOSTNAME_PORT: ${OR_SSL_PORT:--1}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ISSUER_BASE_URI: https://${OR_HOSTNAME}/auth

  manager:
    image: openremote/manager:${MANAGER_VERSION:-latest}
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    extra_hosts:
      - "${OR_HOSTNAME}:host-gateway"
    volumes:
      - manager-data:/storage
      - ./deploy/manager:/deployment
    environment:
      OR_HOSTNAME: ${OR_HOSTNAME:?Hostname required}
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:?Admin password required}
      OR_SSL_PORT: ${OR_SSL_PORT:--1}
      OR_DEV_MODE: ${OR_DEV_MODE:-false}
      OR_METRICS_ENABLED: ${OR_METRICS_ENABLED:-true}
      OR_DATA_POINTS_MAX_AGE_DAYS: 180
      OR_KEYCLOAK_HOST: keycloak
      OR_KEYCLOAK_PORT: 8080

  proxy:
    image: openremote/proxy:${PROXY_VERSION:-latest}
    restart: always
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "8883:8883"
    configs:
      - source: haproxy-config
        target: /data/proxy/haproxy.cfg
      - source: mqtt-server-cert
        target: /certs/mqtt-server-combined.pem
      - source: mqtt-ca-cert
        target: /certs/ca.pem
    volumes:
      - proxy-data:/deployment
    environment:
      HAPROXY_CONFIG: '/data/proxy/haproxy.cfg'
      DOMAINNAME: ${OR_HOSTNAME:?Hostname required}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openremote.rule=Host(`${OR_HOSTNAME}`)"
      - "traefik.http.routers.openremote.entrypoints=http,https"
      - "traefik.http.routers.openremote.tls=true"
      - "traefik.http.services.openremote.loadbalancer.server.port=80"
      - "traefik.http.services.openremote.loadbalancer.server.scheme=http"
      - "traefik.http.services.openremote.loadbalancer.healthcheck.path=/docker-health"
      - "traefik.http.routers.openremote.priority=1"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.openremote.middlewares=sslheader"

  custom-ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "${OR_HOSTNAME}:host-gateway"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      PYTHONUNBUFFERED: "1"
      OR_HOSTNAME: ${OR_HOSTNAME:?Hostname required}
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:?Admin password required}
      HAWKBIT_URL: http://hawkbit:8080/ota
      HAWKBIT_USER: admin
      HAWKBIT_PASSWORD: "admin"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.customui.rule=Host(`${OR_CUSTOMUI_HOSTNAME}`)"
      - "traefik.http.routers.customui.entrypoints=http,https"
      - "traefik.http.routers.customui.tls=true"
      - "traefik.http.services.customui.loadbalancer.server.port=5000"

  # -------------------------
  # HAWKBIT OTA UPDATE SERVICES
  # -------------------------

  # Dedicated PostgreSQL for HawkBit (isolated from OpenRemote DB)
  hawkbitdb:
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest}
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: 'hawkbit'
      POSTGRES_USER: ${HAWKBIT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${HAWKBIT_DB_PASSWORD:-postgres}
    volumes:
      - hawkbit-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d hawkbit" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # HawkBit Update Server (backend API)
  hawkbit:
    image: openremote/hawkbit-update-server:${HAWKBIT_VERSION:-latest}
    restart: always
    depends_on:
      hawkbitdb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "${OR_HOSTNAME}:host-gateway"
    volumes:
      - hawkbit-artifact-data:/opt/hawkbit/artifactrepo
    environment:
      LOGGING_LEVEL_ROOT: INFO
      SERVER_SERVLET_CONTEXT_PATH: /ota
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_URL: jdbc:postgresql://hawkbitdb:5432/hawkbit
      SPRING_DATASOURCE_USERNAME: ${HAWKBIT_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${HAWKBIT_DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE: POSTGRESQL
      HAWKBIT_DMF_RABBITMQ_ENABLED: "false"
      HAWKBIT_ARTIFACT_URL_PROTOCOLS_DOWNLOAD_HTTP_PORT: 443
      HAWKBIT_ARTIFACT_URL_PROTOCOLS_DOWNLOAD_HTTP_PROTOCOL: https
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: ${HAWKBIT_OIDC_CLIENT_ID:-hawkbit}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: ${HAWKBIT_OIDC_CLIENT_SECRET:-}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: https://${OR_HOSTNAME}/auth/realms/master
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/master/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${OR_HOSTNAME}/auth/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/master/protocol/openid-connect/certs
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 256MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 256MB
      HAWKBIT_SERVER_SECURITY_DOS_MAXARTIFACTSIZE: 268435456

  # HawkBit Simple UI (web management dashboard)
  hawkbit-simple-ui:
    image: hawkbit/hawkbit-simple-ui:latest
    restart: always
    depends_on:
      - hawkbit
    extra_hosts:
      - "${OR_HOSTNAME}:host-gateway"
    environment:
      HAWKBIT_SERVER_MGMTURL: https://${OR_HOSTNAME}/ota
      SPRING_PROFILES_ACTIVE: simple-ui
      SERVER_PORT: 8088
      SERVER_SERVLET_CONTEXT_PATH: /ota/ui
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 256MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 256MB
