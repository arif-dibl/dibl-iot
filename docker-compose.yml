# OpenRemote v3
#
# Profile that runs the stack by default on https://localhost using a self-signed SSL certificate,
# but optionally on https://$OR_HOSTNAME with an auto generated SSL certificate from Letsencrypt.
#
# It is configured to use the AWS logging driver.
#
volumes:
  proxy-data:
  manager-data:
  postgresql-data:
  hawkbit-data:
  hawkbit-artifact-data:


services:

  proxy:
    image: openremote/proxy:${PROXY_VERSION:-latest}
    restart: always
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "80:80" # Needed for SSL generation using letsencrypt
      - "${OR_SSL_PORT:-443}:443"
      - "8883:8883"
      - "127.0.0.1:8404:8404" # Localhost metrics access
      - "${PRIVATE_IP:-127.0.0.1}:8404:8404"
        # Allows to also expose metrics on a given IP address,
        # intended to be IP of the interface of the private subnet of the EC2 VM
    volumes:
      - proxy-data:/deployment
    environment:
      LE_EMAIL: ${OR_EMAIL_ADMIN:-}
      DOMAINNAME: ${OR_HOSTNAME:-localhost}
      DOMAINNAMES: ${OR_ADDITIONAL_HOSTNAMES:-}
      # USE A CUSTOM PROXY CONFIG - COPY FROM https://raw.githubusercontent.com/openremote/proxy/main/haproxy.cfg
      #HAPROXY_CONFIG: '/data/proxy/haproxy.cfg'

  postgresql:
    restart: always
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest}
    shm_size: 128mb
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - manager-data:/storage

  keycloak:
    restart: always
    image: openremote/keycloak:${KEYCLOAK_VERSION:-latest}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./deploy:/deployment
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      KC_HOSTNAME: ${OR_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${OR_SSL_PORT:--1}

  manager:
    #    privileged: true
    restart: always
    image: openremote/manager:${MANAGER_VERSION:-latest}
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8405:8405" # Localhost metrics access
      - "${PRIVATE_IP:-127.0.0.1}:8405:8405"
        # Allows to also expose metrics on a given IP address,
        # intended to be IP of the interface of the private subnet of the EC2 VM
    environment:
      OR_SETUP_TYPE:
      OR_ADMIN_PASSWORD:
      OR_SETUP_RUN_ON_RESTART:
      OR_EMAIL_HOST:
      OR_EMAIL_USER:
      OR_EMAIL_PASSWORD:
      OR_EMAIL_X_HEADERS:
      OR_EMAIL_FROM:
      OR_EMAIL_ADMIN:
      OR_METRICS_ENABLED: ${OR_METRICS_ENABLED:-true}
      OR_HOSTNAME: ${OR_HOSTNAME:-localhost}
      OR_ADDITIONAL_HOSTNAMES:
      OR_SSL_PORT: ${OR_SSL_PORT:--1}
      OR_DEV_MODE: ${OR_DEV_MODE:-false}
      OR_DATA_POINTS_MAX_AGE_DAYS: 180

      # The following variables will configure the demo
      OR_FORECAST_SOLAR_API_KEY:
      OR_OPEN_WEATHER_API_APP_ID:
      OR_SETUP_IMPORT_DEMO_AGENT_KNX:
      OR_SETUP_IMPORT_DEMO_AGENT_VELBUS:
    volumes:
      # - ./deployment:/deployment
      - manager-data:/storage

  custom-ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      OR_HOSTNAME: ${OR_HOSTNAME:-localhost}
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
    depends_on:
      keycloak:
        condition: service_healthy

  # -------------------------
  # HAWKBIT OTA UPDATE SERVICES
  # -------------------------

  # Dedicated PostgreSQL for HawkBit (isolated from OpenRemote DB)
  hawkbitdb:
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest}
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: 'hawkbit'
      POSTGRES_USER: ${HAWKBIT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${HAWKBIT_DB_PASSWORD:-postgres}
    volumes:
      - hawkbit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAWKBIT_DB_USER:-postgres} -d hawkbit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HawkBit Update Server (backend API)
  hawkbit:
    image: openremote/hawkbit-update-server:${HAWKBIT_VERSION:-latest}
    restart: always
    depends_on:
      hawkbitdb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8090:8080"
    volumes:
      - hawkbit-artifact-data:/opt/hawkbit/artifactrepo
    environment:
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      # Context Path
      SERVER_SERVLET_CONTEXT_PATH: /ota
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://hawkbitdb:5432/hawkbit
      SPRING_DATASOURCE_USERNAME: ${HAWKBIT_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${HAWKBIT_DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE: POSTGRESQL
      # Disable RabbitMQ (not used)
      HAWKBIT_DMF_RABBITMQ_ENABLED: "false"
      # Artifact download config
      HAWKBIT_ARTIFACT_URL_PROTOCOLS_DOWNLOAD_HTTP_PORT: 8080
      HAWKBIT_ARTIFACT_URL_PROTOCOLS_DOWNLOAD_HTTP_PROTOCOL: http
      # Keycloak OAuth2/OIDC Authentication
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: ${HAWKBIT_OIDC_CLIENT_ID:-hawkbit}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: ${HAWKBIT_OIDC_CLIENT_SECRET:-}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: http://keycloak:8080/auth/realms/master
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/master/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/auth/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/master/protocol/openid-connect/certs

  # HawkBit Simple UI (web management dashboard)
  hawkbit-simple-ui:
    image: hawkbit/hawkbit-simple-ui:latest
    restart: always
    depends_on:
      - hawkbit
    ports:
      - "8088:8088"
    environment:
      # Point UI at the hawkbit update server
      HAWKBIT_SERVER_URL: http://hawkbit:8080/ota
      # Run in simple-ui mode
      SPRING_PROFILES_ACTIVE: simple-ui
      SERVER_PORT: 8088
      SERVER_SERVLET_CONTEXT_PATH: /ota/ui
