<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Asset - OpenRemote</title>
    <link rel="icon" type="image/png" href="{{ prefix }}/static/images/favicon.png">
    <link rel="stylesheet" href="{{ prefix }}/static/css/common.css">
    <link rel="stylesheet" href="{{ prefix }}/static/css/auth.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="{{ prefix }}/static/images/logo.png" alt="Logo">
        </div>
    </nav>
    <div class="container">
        <h2>Link Asset</h2>
        <p style="margin-bottom: 1.5rem;">Enter the ID of an asset to link it to your account. <br>
            <span onclick="openDeviceIdInstructions()"
                style="color: var(--primary); cursor: pointer; text-decoration: underline; display: inline-block; margin-top: 5px;">How
                to get device ID?</span>
        </p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="{{ prefix }}/link-asset" method="POST">
            <input type="hidden" name="realm" value="{{ realm }}">
            <input type="hidden" name="username" value="{{ username }}">
            <input type="hidden" name="password" value="{{ password }}">
            <input type="hidden" name="user_id" value="{{ user_id }}">

            <div id="qr-reader"
                style="width: 100%; display: none; margin-bottom: 1rem; border-radius: 8px; overflow: hidden; border: 1px solid var(--border);">
            </div>

            <div class="form-group">
                <label for="asset_id">Asset ID</label>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="text" id="asset_id" name="asset_id" placeholder="e.g. 5yI..." required
                        style="flex: 1;">
                    <button type="button" class="btn-ghost" onclick="toggleQRScanner()"
                        style="padding: 0.7rem; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--bg-light); cursor: pointer;"
                        title="Scan QR Code">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="button-group" style="display: flex; gap: 10px;">
                <button type="submit" name="action" value="link">Confirm</button>
                <button type="submit" name="action" value="skip" style="background-color: #6c757d;"
                    formnovalidate>Skip</button>
            </div>
        </form>
    </div>

    {% include 'device_id_instructions.html' %}

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        let html5QrcodeScanner = null;

        function toggleQRScanner() {
            const reader = document.getElementById('qr-reader');
            if (reader.style.display === 'none' || reader.style.display === '') {
                startQRScanner();
            } else {
                stopQRScanner();
            }
        }

        function startQRScanner() {
            const reader = document.getElementById('qr-reader');
            reader.style.display = 'block';

            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "qr-reader",
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    false
                );
            }

            html5QrcodeScanner.render((decodedText) => {
                document.getElementById('asset_id').value = decodedText;
                stopQRScanner();
            }, () => {
                // Ignore frame errors
            });
        }

        function stopQRScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(err => console.error(err));
                html5QrcodeScanner = null;
            }
            const reader = document.getElementById('qr-reader');
            if (reader) reader.style.display = 'none';
        }
    </script>
</body>

</html>
