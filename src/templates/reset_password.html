{% extends "base.html" %}

{% block title %}Reset Password - DIBL IOT{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white text-center py-4">
                <h3 class="font-weight-light my-2">Set New Password</h3>
            </div>
            <div class="card-body p-5">
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
                </div>
                {% endif %}
                
                <p class="text-muted mb-4">Please enter the 6-digit code sent to your email along with your new password.</p>
                
                <form method="POST" action="{{ prefix }}/reset-password">
                    <input type="hidden" name="email" value="{{ email }}">
                    <div class="form-floating mb-3">
                        <input class="form-control" id="otp" name="otp" type="text" placeholder="123456" required autocomplete="off" />
                        <label for="otp">Verification Code (OTP)</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="password" name="password" type="password" placeholder="New Password" required minlength="6" />
                        <label for="password">New Password</label>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                        <button type="submit" class="btn btn-primary w-100 py-2">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
